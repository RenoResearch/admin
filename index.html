<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Disable caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="admin_console">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>admin_console</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Version check and auto-refresh on new deployment -->
  <script>
    (async function() {
      const STORAGE_KEY = 'admin_app_version';
      
      try {
        // Fetch version with cache-busting
        const response = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await response.json();
        const serverVersion = data.version + '_' + data.buildTime;
        const storedVersion = localStorage.getItem(STORAGE_KEY);
        
        if (storedVersion && storedVersion !== serverVersion) {
          console.log('New version detected, refreshing...');
          localStorage.setItem(STORAGE_KEY, serverVersion);
          
          // Clear all caches
          if (window.caches) {
            const names = await caches.keys();
            await Promise.all(names.map(name => caches.delete(name)));
          }
          
          // Unregister service workers
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(r => r.unregister()));
          }
          
          // Force reload from server
          window.location.reload(true);
          return;
        }
        
        localStorage.setItem(STORAGE_KEY, serverVersion);
      } catch (e) {
        console.log('Version check failed:', e);
      }
      
      // Force service worker update
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.update();
          }
        });
        
        // Listen for service worker updates
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          window.location.reload();
        });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
